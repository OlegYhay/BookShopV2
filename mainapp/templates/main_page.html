{% extends 'base.html' %}
{% load static %}

{% block content %}
<!-- Карусель -->
<div id="carouselExampleControls" class="carousel slide" data-bs-ride="carousel">
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="{% static 'carusel/1.webp' %}" class="d-block w-100" alt="Слайд 1">
    </div>
    <div class="carousel-item">
      <img src="{% static 'carusel/2.webp' %}" class="d-block w-100" alt="Слайд 2">
    </div>
    <div class="carousel-item">
      <img src="{% static 'carusel/3.webp' %}" class="d-block w-100" alt="Слайд 3">
    </div>
    <div class="carousel-item">
      <img src="{% static 'carusel/4.webp' %}" class="d-block w-100" alt="Слайд 4">
    </div>
  </div>
  <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleControls" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Предыдущий</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleControls" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Следующий</span>
  </button>
</div>

<br/>

<h3 class="text-center mb-4">ПОПУЛЯРНЫЕ КНИГИ</h3>

<!-- Секция с карточками книг -->
<div class="container my-5">
  <div class="row g-4">
    {% for book in books %}
    <div class="col-sm-6 col-md-4 col-lg-3">
      <div class="card h-100 border-0 shadow-sm rounded overflow-hidden book-card">
        <a href="{% url 'book_detail' id=book.id %}">
          <img src="{{ book.cover.url }}" class="card-img-top book-cover" alt="{{ book.title }}">
        </a>
        <div class="card-body d-flex flex-column">
          <h5 class="card-title text-truncate">{{ book.title }}</h5>
          <p class="card-text text-muted text-truncate">{{ book.author }}</p>
          <div class="mt-auto">
            <p class="h6 text-primary">{{ book.price }} &#8381;</p>
          </div>
        </div>
      </div>
    </div>
    {% endfor %}
  </div>
</div>
{% endblock content %}
